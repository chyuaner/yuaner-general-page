name: Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write   # for creating releases
  pages: write      # for deploying to GitHub Pages
  id-token: write   # for OIDC token (required by deploy-pages)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ─── Job 1: Build → Release + Pages artifact ────────────────────────────────
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: "Build ${{ steps.sha.outputs.short }}"
          body: |
            Automated build from commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            Download the `.html` files from the release assets below.
            Each file is a self-contained single-page HTML (no external dependencies).
          files: dist/**
          generate_release_notes: false
          make_latest: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist/

  # ─── Job 2: Deploy to GitHub Pages ──────────────────────────────────────────
  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
        
      - name: Purge Cloudflare Cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_CACHE_PREFIX: ${{ secrets.CLOUDFLARE_CACHE_PREFIX }}
        run: |
          if [ -z "${CLOUDFLARE_ZONE_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_CACHE_PREFIX}" ]; then
            echo "Cloudflare cache purge skipped: missing required secrets."
            exit 0
          fi

          # e.g. "yuaner.tw/yuaner-general-page/" → "yuaner.tw/yuaner-general-page"
          PREFIX="${CLOUDFLARE_CACHE_PREFIX#https://}"
          PREFIX="${PREFIX#http://}"
          PREFIX="${PREFIX%/}"

          echo "Purging Cloudflare cache for prefix: ${PREFIX}"

          RESPONSE="$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"prefixes\":[\"${PREFIX}\"]}")"

          echo "${RESPONSE}"

          if ! echo "${RESPONSE}" | grep -q '"success":true'; then
            echo "Cloudflare cache purge failed."
            exit 1
          fi